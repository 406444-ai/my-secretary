<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мой секретарь</title>
<style>
body {
font-family: Arial, sans-serif;
background: #f4f6f8;
margin: 0;
padding: 24px;
color: #202938;
}
.app {
max-width: 520px;
margin: 40px auto;
background: white;
padding: 25px;
border-radius: 18px;
box-shadow: 0 4px 20px #00000012;
}
h1 { margin-top: 0; }
.entry { display: flex; gap: 8px; }
input {
flex: 1;
min-width: 0;
padding: 13px;
border: 1px solid #ccc;
border-radius: 10px;
font-size: 16px;
}
button {
border: 0;
border-radius: 10px;
padding: 12px;
background: #2563eb;
color: white;
cursor: pointer;
}
li {
display: flex;
align-items: center;
gap: 10px;
padding: 12px 0;
border-bottom: 1px solid #eee;
}
li span { flex: 1; overflow-wrap: anywhere; }
li.done span { text-decoration: line-through; color: #888; }
li.overdue:not(.done) span {
    color: #dc2626;
    font-weight: bold;
}
li.rescheduled:not(.done) span {
  color: #d97706;
  font-weight: bold;
}
li button { background: #eee; color: #333; }
ul { list-style: none; padding: 0; }
.tabs {
display: flex;
gap: 10px;
margin-top: 20px;
margin-bottom: 25px;
}
.tabs button {
background: #e5e7eb;
color: #333;
}

.tabs button.selected {
background: #2563eb;
color: white;
}
#taskModal {
position: fixed;
inset: 0;
background: rgba(0, 0, 0, 0.45);
z-index: 1000;
display: none;
align-items: center;
justify-content: center;
}
#taskModal .modal-content {
background: white;
padding: 25px;
border-radius: 16px;
width: 420px;
max-width: 90%;
box-sizing: border-box;
}
#taskModal input {
display: block;
width: 100%;
box-sizing: border-box;
margin-bottom: 12px;
padding: 12px;
border: 1px solid #ccc;
border-radius: 8px;
font-size: 16px;
}
</style>
</head>
<body>
<div class="app">
<h1>Мой секретарь</h1>
<p>Что нужно сделать?</p>
<div id="taskModal">
<div class="modal-content">  
<h2>Новая задача</h2>
<input id="modalTask" placeholder="Что нужно сделать?">
<input id="modalDate" placeholder="Дата: ДД.ММ.ГГГГ" maxlength="10">
<input id="modalTime" placeholder="Время: ЧЧ:ММ" maxlength="5">
<button type="button" onclick="saveModalTask()">Сохранить</button>
<button type="button" onclick="document.getElementById('taskModal').style.display='none'">Отмена</button>
</div>
</div>

<div class="entry">
<input id="task" placeholder="Напиши задачу">
<input id="taskDate" style="display: none;" placeholder="Дата: ДД.ММ.ГГГГ" maxlength="10">
<input id="taskTime" style="display: none;" placeholder="Время: ЧЧ:ММ" maxlength="5">
<script>
function formatInput(id, groups, separator) {
const input = document.getElementById(id);

input.addEventListener("input", function (event) {
const isDate = id === "taskDate" || id === "modalDate";
const maxDigits = isDate ? 8 : 4;
const digits = this.value.replace(/\D/g, "").slice(0, maxDigits);

let result = "";
let position = 0;

for (const size of groups) {
if (position >= digits.length) break;

if (result) result += separator;

result += digits.slice(position, position + size);
position += size;
}

// Если введена короткая дата, например 201026

this.value = result;
});
input.addEventListener("keydown", function (event) {
if (event.key !== "Enter" && event.key !== " ") return;
if (id !== "taskDate" && id !== "modalDate") return;

const digits = input.value.replace(/\D/g, "");

if (digits.length === 6) {
event.preventDefault();
input.value = digits.slice(0, 2) + "." +
digits.slice(2, 4) + ".20" +
digits.slice(4, 6);
}
});
}

function completeDate(id) {
const input = document.getElementById(id);

input.addEventListener("blur", function () {
const match = this.value.match(/^(\d{2})\.(\d{2})\.(\d{2})$/);

if (match) {
this.value = match[1] + "." + match[2] + ".20" + match[3];
}
});
}
document.addEventListener("DOMContentLoaded", function () {
formatInput("taskDate", [2, 2, 4], ".");
formatInput("taskTime", [2, 2], ":");
formatInput("modalDate", [2, 2, 4], ".");
formatInput("modalTime", [2, 2], ":");
completeDate("taskDate");
completeDate("modalDate");
});
</script>
<button onclick="editingTask=null; document.getElementById('modalTask').value=''; document.getElementById('modalDate').value=''; document.getElementById('modalTime').value=''; document.getElementById('taskModal').style.display='flex'">Добавить</button>
</div>
<div class="tabs">
<button onclick="showTab('active')">Активные</button>
<button onclick="showTab('done')">Выполненные</button>
</div>
<ul id="list"></ul>
</div>

<script>
const storageKey = "my-secretary-tasks";
let tasks = JSON.parse(localStorage.getItem(storageKey) || "[]");

function save() {
localStorage.setItem(storageKey, JSON.stringify(tasks));
}

let currentTab = "active";

function showTab(tab) {
currentTab = tab;

document.querySelectorAll(".tabs button").forEach((button, index) => {
button.classList.toggle("selected",
(index === 0 && tab === "active") ||
(index === 1 && tab === "done")
);
});

render();
}
function render() {
const list = document.getElementById("list");
list.innerHTML = "";
tasks.sort((a, b) => {
const dateA = a.date ? new Date(a.date).getTime() : Infinity;
const dateB = b.date ? new Date(b.date).getTime() : Infinity;
return dateA - dateB;
});

tasks.forEach((task, index) => {
if (currentTab === "active" && task.done) return;
if (currentTab === "done" && !task.done) return;  
const li = document.createElement("li");
if (task.done) li.classList.add("done");
if (task.rescheduled && !task.done && (!task.date || new Date(task.date) >= new Date())) li.classList.add("rescheduled");
if (task.date && !task.done && new Date(task.date) < new Date()) {
li.classList.add("overdue");
}

const check = document.createElement("input");
check.type = "checkbox";
check.checked = task.done;
check.onchange = () => {
tasks[index].done = check.checked;
save();
render();
};

const text = document.createElement("span");
text.textContent = task.text;
if (task.date) {
const formattedDate = new Date(task.date).toLocaleString("ru-RU", {
day: "numeric",
month: "long",
year: "numeric",
hour: "2-digit",
minute: "2-digit"
});
text.textContent += " — " + formattedDate;
}

const remove = document.createElement("button");
remove.textContent = "Удалить";
remove.onclick = () => {
tasks.splice(index, 1);
save();
render();
};
const edit = document.createElement("button");
edit.textContent = "Изменить";
edit.onclick = () => {
editingTask = task;   
document.getElementById("modalTask").value = task.text;

const date = task.date ? new Date(task.date) : null;

document.getElementById("modalDate").value = date
? String(date.getDate()).padStart(2, "0") + "." +
String(date.getMonth() + 1).padStart(2, "0") + "." +
date.getFullYear()
: "";

document.getElementById("modalTime").value = date
? String(date.getHours()).padStart(2, "0") + ":" +
String(date.getMinutes()).padStart(2, "0")
: "";

document.getElementById("taskModal").style.display = "flex";
};
li.append(check, text, edit, remove);
list.appendChild(li);
});
}


function recognizeDate(text) {
const today = new Date();
const date = new Date(today);
const lower = text.toLowerCase();

if (lower.includes("послезавтра")) {
date.setDate(date.getDate() + 2);
} else if (lower.includes("завтра")) {
date.setDate(date.getDate() + 1);
} else if (!lower.includes("сегодня")) {
return null;
}

const time = lower.match(/(?:в\s+)?([01]?\d|2[0-3]):([0-5]\d)/);
if (time) {
date.setHours(Number(time[1]), Number(time[2]), 0, 0);
} else {
date.setHours(0, 0, 0, 0);
}

return date.toISOString();
}
function addTask() {
const input = document.getElementById("task");
const text = input.value.trim();
if (!text) return;
const dateInput = document.getElementById("taskDate");
const timeInput = document.getElementById("taskTime");

let taskDate = recognizeDate(text);

const dateText = dateInput.value.trim();
const timeText = timeInput.value.trim();

if (dateText || timeText) {
if (!/^\d{2}\.\d{2}\.\d{4}$/.test(dateText) ||
!/^\d{2}:\d{2}$/.test(timeText)) {
alert("Заполни дату и время полностью");
return;
}

const [day, month, year] = dateText.split(".").map(Number);
const [hours, minutes] = timeText.split(":").map(Number);

const date = new Date(year, month - 1, day, hours, minutes);

if (date.getFullYear() !== year ||
date.getMonth() !== month - 1 ||
date.getDate() !== day ||
date.getHours() !== hours ||
date.getMinutes() !== minutes) {
alert("Проверь правильность даты и времени");
return;
}

taskDate = date.toISOString();
}

tasks.push({
text: text,
done: false,
date: taskDate
});
input.value = "";
dateInput.value = "";
timeInput.value = "";
save();
render();
}
let editingTask = null;
function saveModalTask() {
document.getElementById("task").value =
document.getElementById("modalTask").value;

document.getElementById("taskDate").value =
document.getElementById("modalDate").value;

document.getElementById("taskTime").value =
document.getElementById("modalTime").value;

if (editingTask !== null) {
editingTask.text = document.getElementById("modalTask").value.trim();
const dateText = document.getElementById("modalDate").value.trim();
const timeText = document.getElementById("modalTime").value.trim();

if (dateText && timeText) {
const parts = dateText.split(".");
const day = Number(parts[0]);
const month = Number(parts[1]);
const year = Number(parts[2]);

const newDate = new Date(
year, month - 1, day,
Number(timeText.split(":")[0]),
Number(timeText.split(":")[1])
);

if (isNaN(newDate.getTime()) ||
newDate.getDate() !== day ||
newDate.getMonth() !== month - 1 ||
newDate.getFullYear() !== year) {
alert("Неверная дата или время");
return;
}

if (editingTask.date && new Date(editingTask.date) < new Date()) {
editingTask.rescheduled = true;
}

editingTask.date = newDate.toISOString();
}

save();
render();
editingTask = null;
} else {
addTask();
}

document.getElementById("taskModal").style.display = "none";
}
document.getElementById("task").addEventListener("keydown", e => {
if (e.key === "Enter") addTask();
});

showTab("active");
</script>
</body>
</html>
